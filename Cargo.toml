[package]
name = "eth-light-client"
version = "0.1.0"
edition = "2021"
description = "Verification-only Ethereum consensus-layer light client"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EchoAlice/eth-light-client"
keywords = ["ethereum", "blockchain", "light-client", "consensus"]
categories = ["cryptography", "network-programming"]
resolver = "2"

[dependencies]
hex = "0.4"
blst = "0.3.10" 
ethereum_ssz = "0.10"
ethereum_ssz_derive = "0.10"
tree_hash = "0.12"
tree_hash_derive = "0.12"
ethereum_hashing = "0.8"
thiserror = "1.0"
ssz_types = "0.14"
alloy-primitives = "1"

[features]
default = []

# Testing
[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
snap = "1.1"
tree_hash = "0.12"
ureq = "3.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
